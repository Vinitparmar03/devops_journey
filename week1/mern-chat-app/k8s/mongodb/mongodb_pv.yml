apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  labels:
    app: mongodb-pv
spec:
  storageClassName: ""
  claimRef:
    name: mongodb-pvc
    namespace: default
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: 
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data"